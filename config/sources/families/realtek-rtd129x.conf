# Realtek RTD1295/RTD1296: mainline kernel, vendor u-boot 2015.07 binary.
# Kernel patches: https://github.com/JalenLin/BPI-W2-linux
#
declare -g ARCH="arm64"
declare -g LINUXFAMILY="realtek-rtd129x"
declare -g LINUXCONFIG="linux-${LINUXFAMILY}-${BRANCH}"
declare -g SERIALCON="ttyS0:115200"

# Vendor u-boot is prebuilt; this family does not build u-boot.
declare -g BOOTCONFIG="none"
declare -g BOOTFS_TYPE="fat"
declare -g BOOTSIZE="512"
# p1 at sector 204800, as in the vendor image layout
declare -g OFFSET="100"

# Vendor boot files, pinned to a BPI-W2-bsp commit
declare -g RTD129X_BLOB_URL="https://raw.githubusercontent.com/BPI-SINOVOIP/BPI-W2-bsp/6e6aefc35dc50b1b8231cdb03a995d088f29eb21/rtk-pack/rtk/bpi-w2"
declare -g -A RTD129X_BLOBS=(
	["bin/u-boot.bin"]="0b62fc30518af92cf3a380c3baba07b78f0ecf79f926492f73813ea51bed1f05"
	["configs/default/linux/bluecore.audio"]="59252270f05cc55cba0ddeb246bc7c6b20dab9554fa18be4e9595ea549fd9b1c"
)
# Directory on FAT p1 that vendor u-boot reads (compiled in). Board can override.
declare -g RTD129X_VENDOR_BOOT_DIR="${RTD129X_VENDOR_BOOT_DIR:-bananapi/bpi-w2/linux}"
# Vendor u-boot loads the kernel at text_offset; this address is clear of firmware memory.
declare -g RTD129X_TEXT_OFFSET="0x1c000000"

case "${BRANCH}" in

	current)
		declare -g KERNEL_MAJOR_MINOR="6.18"
		;;

	edge)
		declare -g KERNEL_MAJOR_MINOR="7.3"
		;;

esac

declare -g KERNELPATCHDIR="archive/${LINUXFAMILY}-${KERNEL_MAJOR_MINOR}"

# Mainline sets text_offset to 0. Vendor u-boot then loads the kernel onto the boot ROM.
function pre_package_kernel_image__rtd129x_set_text_offset() {
	display_alert "${BOARD}" "Set arm64 Image text_offset to ${RTD129X_TEXT_OFFSET}" "info"
	declare image="${kernel_image_pre_package_path:?}"
	[[ "$(dd if="${image}" bs=1 skip=56 count=4 status=none)" == $'ARM\x64' ]] ||
		exit_with_error "Not an arm64 Image" "${image}"
	declare esc="" i
	for i in {0..7}; do
		esc+="\\x$(printf '%02x' $(((RTD129X_TEXT_OFFSET >> (8 * i)) & 0xff)))"
	done
	printf "${esc}" | dd of="${image}" bs=1 seek=8 conv=notrunc status=none
}

function post_family_tweaks_bsp__rtd129x_vendor_boot() {
	display_alert "${BOARD}" "Add vendor boot files and kernel hook" "info"
	declare cache="${SRC}/cache/rtd129x-blobs" blob dst="${destination}/usr/lib/armbian/rtd129x"
	run_host_command_logged mkdir -p "${cache}" "${dst}" "${destination}/etc/kernel/postinst.d"
	for blob in "${!RTD129X_BLOBS[@]}"; do
		declare file="${cache}/$(basename "${blob}")"
		if ! echo "${RTD129X_BLOBS[${blob}]}  ${file}" | sha256sum --check --status 2> /dev/null; then
			run_host_command_logged curl -fsSL -o "${file}" "${RTD129X_BLOB_URL}/${blob}"
			echo "${RTD129X_BLOBS[${blob}]}  ${file}" | sha256sum --check --status ||
				exit_with_error "Checksum mismatch" "${blob}"
		fi
		run_host_command_logged cp -v "${file}" "${dst}/"
	done

	# Vendor u-boot ignores boot scripts; it reads fixed file names from FAT p1.
	cat <<- EOT > "${destination}/etc/kernel/postinst.d/zz-rtd129x-vendor-boot"
		#!/bin/bash
		# Copy kernel, DTB and audio firmware to the paths vendor u-boot reads.
		# Args: <version> <image>. No args: use the newest installed kernel.
		set -e
		version="\${1:-\$(ls /boot/vmlinuz-* 2> /dev/null | sed "s|^/boot/vmlinuz-||" | sort -V | tail -1)}"
		image="\${2:-/boot/vmlinuz-\${version}}"
		dtb="/usr/lib/linux-image-\${version}/${BOOT_FDT_FILE}"
		dir="/boot/${RTD129X_VENDOR_BOOT_DIR}"
		[ -f "\${image}" ] && [ -f "\${dtb}" ] || { echo "rtd129x: kernel \${version} incomplete, skip" >&2; exit 0; }
		mkdir -p "\${dir}"
		put() { cp "\$1" "\${dir}/\$2.tmp" && sync && mv -f "\${dir}/\$2.tmp" "\${dir}/\$2"; }
		put "\${image}" uImage
		put "\${dtb}" bpi-w2.dtb
		put /usr/lib/armbian/rtd129x/bluecore.audio bluecore.audio
		echo "rtd129x: vendor boot files updated for \${version}"
	EOT
	run_host_command_logged chmod 755 "${destination}/etc/kernel/postinst.d/zz-rtd129x-vendor-boot"
}

# The kernel can install before the BSP package, so run the hook once more.
function post_customize_image__rtd129x_vendor_boot_files() {
	chroot_sdcard /etc/kernel/postinst.d/zz-rtd129x-vendor-boot
}

function pre_umount_final_image__rtd129x_write_vendor_uboot() {
	display_alert "${BOARD}" "Write vendor u-boot at 40 KiB" "info"
	run_host_command_logged dd if="${MOUNT}/usr/lib/armbian/rtd129x/u-boot.bin" of="${LOOP}" bs=1024 seek=40 conv=notrunc,fsync status=none
}
